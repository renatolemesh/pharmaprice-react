<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/cruz_svg.svg" />
    <meta
      name="description"
      content="Comparador de preços de medicamentos entre farmácias."
    />
    <!-- A busca leva alguns segundos no servidor; abrir a conexão desde já
         economiza o DNS + TLS da primeira requisição. -->
    <link rel="preconnect" href="https://api.pharmaprices.shop" crossorigin />
    <title>PharmaPrice</title>
    <script>
      // Aplica o tema antes da primeira pintura. Sem isto a tela pisca branca
      // por um quadro antes do React montar e ligar a classe `dark`.
      (function () {
        try {
          var salvo = localStorage.getItem("pharmaprice-theme");
          var escuro =
            salvo === "dark" ||
            (!salvo &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage bloqueado: segue no tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
